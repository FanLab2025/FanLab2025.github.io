<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Research themes of FAN Lab at the College of Jiyang, Zhejiang A&F University." />
  <title>Research · FAN Lab</title>
  <script>
    (function () {
      try {
        var l = localStorage.getItem("lab-lang");
        if (l !== "zh" && l !== "en") {
          var n = (navigator.language || "en").toLowerCase();
          l = n.indexOf("zh") === 0 ? "zh" : "en";
        }
        document.documentElement.lang = l === "zh" ? "zh-CN" : "en";
        document.documentElement.setAttribute("data-lang", l);
      } catch (e) {}
    })();
  </script>
  <link rel="icon" href="assets/images/fanlab-favicon-v2.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <a class="skip-link" href="#main" data-i18n="skipToContent">Skip to content</a>

  <header class="site-header" id="site-header" role="banner"></header>

  <main id="main" class="main">
    <div class="container">
      <header class="page-intro">
        <span class="section__eyebrow" data-i18n="research.eyebrow">Themes</span>
        <h1 data-i18n="research.title">Research</h1>
        <p data-i18n="research.lede">Laboratory research directions. Short descriptions use placeholder text until real summaries are provided — no invented claims or results.</p>
      </header>

      <div class="theme-list" id="theme-list" aria-live="polite">
        <p class="status-msg" data-i18n="research.loading">Loading research themes…</p>
      </div>
    </div>
  </main>

  <footer class="site-footer" id="site-footer" role="contentinfo"></footer>

  <script src="js/main.js"></script>
  <script src="js/render.js"></script>
  <script>
    (function () {
      var themes = null;
      function draw() {
        if (!themes) return;
        LabRender.renderThemes(themes, document.getElementById("theme-list"));
      }
      document.addEventListener("DOMContentLoaded", function () {
        LabSite.loadSite()
          .then(function () {
            return LabSite.fetchJSON(LabSite.DATA_BASE + "research.json");
          })
          .then(function (data) {
            themes = data.themes || [];
            draw();
            if (window.location.hash) {
              var target = document.querySelector(window.location.hash);
              if (target) target.scrollIntoView({ behavior: "smooth", block: "start" });
            }
          })
          .catch(function (err) {
            console.error(err);
            var el = document.getElementById("theme-list");
            if (el) {
              el.innerHTML = '<p class="status-msg status-msg--error">' +
                LabSite.escapeHtml(LabSite.t("status.loadFail")) +
                "</p>";
            }
          });
      });
      window.addEventListener("lab-lang-change", draw);
    })();
  </script>
</body>
</html>
